# Tmux Configuration
# This file is sourced by home-manager but can also be used standalone

# ==============================================================================
# Terminal & Colors
# ==============================================================================

# Enable 24-bit colour range
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ==============================================================================
# Window Navigation
# ==============================================================================

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift alt vim keys to switch windows
bind -n M-h previous-window
bind -n M-l next-window

# ==============================================================================
# Session Management
# ==============================================================================

# Auto restore tmux sessions (requires tmux-continuum plugin)
set -g @continuum-restore 'on'

# ==============================================================================
# Catppuccin Theme Options
# ==============================================================================

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_default_text "#{b:pane_current_path} (#W)" # #W is application
set -g @catppuccin_window_current_text "#{b:pane_current_path} (#W)" # #{b:pane_current_path} for directory

# ==============================================================================
# Vi Mode & Copy
# ==============================================================================

# Set vi-mode
set-window-option -g mode-keys vi

# Keybindings for copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# Pane Splitting
# ==============================================================================

# Split panes and keep current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ==============================================================================
# Vim-Tmux Navigator Integration
# ==============================================================================
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# Decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

# Copy mode navigation
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

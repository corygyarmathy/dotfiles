"$schema" = 'https://starship.rs/config-schema.json'

# Performance tuning
scan_timeout = 30
command_timeout = 500

format = """
[](surface0)\
$os\
$username\
$shell\
$sudo\
[](bg:sapphire fg:surface0)\
$directory\
[](fg:sapphire bg:red)\
$git_status\
$git_branch\
[](fg:red bg:teal)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$lua\
[](fg:teal bg:blue)\
$docker_context\
$conda\
$nix_shell\
[](fg:blue bg:purple)\
$time\
[ ](fg:purple)\
$line_break$character"""

palette = 'tokyo_night_moon'

[palettes.tokyo_night_moon]
# Mapping base24 "Tokyo Night Moon" by Michaël Ball / enkia to Starship semantic names.
#
# The prompt format references: surface0, text, sapphire, red, teal, blue, purple,
# base, mantle, green, lavender, peach.  Each is mapped to the closest base24 role.
#
# Background tiers
base = "#222436"     # base00 — primary background
mantle = "#1e2030"   # base01 — slightly lighter background
crust = "#1a1b2a"    # base11 — darkest background
surface0 = "#2f334d" # base02 — selection / UI chrome background
surface1 = "#444a73" # base03 — comments / subtle UI
surface2 = "#828bb8" # base04 — dark foreground / inactive text
# Foreground
text = "#c8d3f5"     # base05 — default foreground
subtext0 = "#b4c2f0" # base06 — light foreground
subtext1 = "#c8d3f5" # base07 — lightest foreground (same as base05 in this scheme)
# Accent colours — mapped to approximate hue matches
red = "#ff757f"      # base12 — bright red (used for git segment)
maroon = "#c53b53"   # base0F — deeper red / deprecated
peach = "#ffc777"    # base09 — warm amber/orange
yellow = "#ffd793"   # base13 — bright yellow
green = "#c3e88d"    # base0B / base14 — green
teal = "#86e1fc"     # base0C / base15 — cyan (language segment)
sapphire = "#82aaff" # base0D / base16 — blue (directory segment)
blue = "#82aaff"     # base0D — functions / methods blue
lavender = "#fca7ea" # base0E / base17 — pink-magenta
purple = "#c099ff"   # base08 — violet (time segment)
sky = "#86e1fc"      # base0C — alias for teal
pink = "#fca7ea"     # base0E
mauve = "#c099ff"    # base08
# Extra names used in some module styles
rosewater = "#ffd793" # warm light accent
flamingo = "#ff757f"  # warm red accent
overlay0 = "#444a73"  # base03
overlay1 = "#828bb8"  # base04
overlay2 = "#b4c2f0"  # base06

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#f2f2f2"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#e3e5e5"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
NixOS = ""

[username]
show_always = false
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user]($style)'

[shell]
disabled = false
bash_indicator = '󱆃'
fish_indicator = '󰈺'
zsh_indicator = ''
powershell_indicator = ''
pwsh_indicator = ''
unknown_indicator = '?_'
format = '[ $indicator ]($style)'
style = "bg:surface0 fg:text"

[sudo]
disabled = false
style = "bg:surface0 fg:text"
symbol = '󱕴 '
format = '[$symbol]($style)'

# Directory section

[directory]
style = "fg:text bg:sapphire"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_status]
style = "bg:teal"
format = '[[  ($all_status$ahead_behind)](fg:text bg:red)]($style)'

[git_branch]
symbol = ""
ignore_branches = ['master', 'main']
style = "bg:teal"
format = '[[ $symbol $branch ](fg:base bg:red)]($style)'

# Programming languages

[nodejs]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[rust]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[golang]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[php]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[java]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[kotlin]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[haskell]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[python]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

[lua]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:surface1 bg:teal)]($style)'

# Context

[docker_context]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $context) ](fg:text bg:blue)]($style)'

[conda]
style = "bg:blue"
format = '[[ $symbol( $environment) ](fg:text bg:blue)]($style)'

[nix_shell]
disabled = false
heuristic = true
symbol = ''
impure_msg = ''
pure_msg = ''
unknown_msg = ''
style = "bg:blue"
format = '[[ $symbol$state ](fg:text bg:blue)]($style)'

# Time / final section

[time]
disabled = false
time_format = "%R"
style = "bg:peach"
format = '[[  $time ](fg:surface0 bg:purple)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

[cmd_duration]
min_time = 3000
format = '[ 󱎫 $duration]($style) '
style = "fg:yellow"

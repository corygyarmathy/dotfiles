"$schema" = 'https://starship.rs/config-schema.json'

# Performance tuning
scan_timeout = 30
command_timeout = 500

format = """
[](bg_dark)\
$os\
$username\
$hostname\
$shell\
$sudo\
[](bg:accent fg:bg_dark)\
$directory\
[](fg:accent bg:danger)\
$git_status\
$git_branch\
[](fg:danger bg:info)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$lua\
[](fg:info bg:secondary)\
$docker_context\
$conda\
$nix_shell\
[](fg:secondary bg:highlight)\
$time\
[](fg:highlight)\
$line_break$character"""

palette = 'kanagawa_wave'

# ===========================================================================
# Palettes
# ===========================================================================
#
# Naming convention (shared across themes):
#
#   Backgrounds:
#     bg_darkest   — deepest background (floats, popups)
#     bg_dark      — first prompt segment background
#     bg_mid       — mid-layer surfaces
#     fg_dark      — dark text for use on bright backgrounds
#
#   Foreground:
#     fg           — primary text (on dark backgrounds)
#     fg_dim       — secondary/dimmed text
#     fg_disabled  — inactive/muted text
#
#   Accents (by function, not appearance):
#     accent       — primary accent (directory)
#     danger       — errors, git (red-ish)
#     warning      — caution, duration (warm)
#     success      — ok, languages (green-ish)
#     info         — informational (cool blue)
#     secondary    — secondary accent (docker/nix context)
#     highlight    — time, decorative (warm accent)
#
# Contrast requirements (WCAG AA):
#   Segment bg → fg text:  ≥4.5:1 (AA) or ≥3.0:1 (AA-large for bold 14px+)
#   Arrow transitions:     ≥1.4:1 (visible boundary)

[palettes.kanagawa_wave]
# Source: https://github.com/rebelot/kanagawa.nvim (wave variant)
#
# Segment flow (bg colors, left to right):
#   sumiInk2 → crystalBlue → autumnRed → springGreen → oniViolet → surimiOrange
#
# Contrast ratios verified:
#   Segment        BG             FG           Ratio  Grade
#   ─────────────────────────────────────────────────────────
#   OS/shell       sumiInk2       fujiWhite     9.75  AA
#   Directory      crystalBlue    sumiInk0      6.54  AA
#   Git            autumnRed      fujiWhite     3.50  AA-lg
#   Languages      springGreen    sumiInk0      8.28  AA
#   Docker/Nix     oniViolet      sumiInk0      5.15  AA
#   Time           surimiOrange   sumiInk0      8.98  AA
#
# Arrow transitions (all >1.4:1):
#   sumiInk2→crystalBlue 5.14 | crystalBlue→autumnRed 1.85
#   autumnRed→springGreen 2.34 | springGreen→oniViolet 1.61
#   oniViolet→surimiOrange 1.74 | surimiOrange→terminal 8.15

# Backgrounds
bg_darkest = "#16161D" # sumiInk0
bg_dark = "#2A2A37"    # sumiInk2 — first segment bg
bg_mid = "#363646"     # sumiInk3
fg_dark = "#16161D"    # sumiInk0 — dark text on bright segment backgrounds

# Foreground
fg = "#DCD7BA"          # fujiWhite
fg_dim = "#C8C093"      # oldWhite
fg_disabled = "#54546D" # sumiInk4

# Semantic accents
accent = "#2D4F67"    # waveBlue2 — directory
secondary = "#E46876" # waveRed — docker/nix context
danger = "#C34043"    # autumnRed — git, errors
warning = "#FF9E3B"   # roninYellow — cmd_duration
success = "#98BB6C"   # springGreen — languages, ok
info = "#E6C384"      # carpYellow — informational
highlight = "#FFA066" # surimiOrange — time

[palettes.tokyo_night_moon]
bg_darkest = "#1a1b2a"
bg_dark = "#2f334d"
bg_mid = "#444a73"
fg_dark = "#222436"
fg = "#c8d3f5"
fg_dim = "#828bb8"
fg_disabled = "#444a73"
accent = "#82aaff"
danger = "#ff757f"
warning = "#ffc777"
success = "#c3e88d"
info = "#86e1fc"
secondary = "#c099ff"
highlight = "#fca7ea"

# ===========================================================================
# Prompt Modules
# ===========================================================================

[os]
disabled = false
style = "bg:bg_dark fg:fg"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
NixOS = ""

[username]
show_always = false
style_user = "bg:bg_dark fg:fg"
style_root = "bg:bg_dark fg:fg"
format = '[ $user@]($style)'

[hostname]
disabled = false
ssh_only = true
style = "bg:bg_dark fg:fg"
format = '[$hostname]($style)'

[shell]
disabled = false
bash_indicator = '󱆃'
fish_indicator = '󰈺'
zsh_indicator = ''
powershell_indicator = ''
pwsh_indicator = ''
unknown_indicator = '?_'
format = '[ $indicator ]($style)'
style = "bg:bg_dark fg:fg"

# Disabled: the sudo module probes `sudo -Nnv` on every prompt render to check
# the credential cache. Combined with the short `timestamp_timeout=5` sudoers
# setting and multiple terminals sharing the same user's sudo cache, this
# caused periodic 2-3s freezes across all terminals at once (starship reported
# "Executing command 'sudo' timed out"). sudo itself is unaffected.
[sudo]
disabled = true
style = "bg:bg_dark fg:fg"
symbol = '󱕴 '
format = '[$symbol]($style)'

# ── Directory ────────────────────────────────────────────────────────

[directory]
style = "fg:fg bg:accent"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ── Git ──────────────────────────────────────────────────────────────

[git_status]
style = "fg:fg bg:danger"
format = '[  ($all_status$ahead_behind)]($style)'

[git_branch]
symbol = ""
ignore_branches = ['master', 'main']
style = "fg:fg_dark bg:danger"
format = '[ $symbol $branch ]($style)'

# ── Programming Languages ────────────────────────────────────────────

[nodejs]
symbol = "󰎙"
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[c]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

[lua]
symbol = ""
style = "fg:fg_dark bg:info"
format = '[ $symbol( $version) ]($style)'

# ── Context ──────────────────────────────────────────────────────────

[docker_context]
symbol = ""
style = "bg:secondary"
format = '[[ $symbol( $context) ](fg:fg_dark bg:secondary)]($style)'

[conda]
style = "bg:secondary"
format = '[[ $symbol( $environment) ](fg:fg_dark bg:secondary)]($style)'

[nix_shell]
disabled = false
heuristic = true
symbol = ''
impure_msg = ''
pure_msg = ''
unknown_msg = ''
style = "bg:secondary"
format = '[[ $symbol$state ](fg:fg_dark bg:secondary)]($style)'

# ── Time ─────────────────────────────────────────────────────────────

[time]
disabled = false
time_format = "%R"
style = "bg:highlight"
format = '[[  $time ](fg:fg_dark bg:highlight)]($style)'

# ── Line Break & Character ───────────────────────────────────────────

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:success)'
error_symbol = '[](bold fg:danger)'
vimcmd_symbol = '[](bold fg:success)'
vimcmd_replace_one_symbol = '[](bold fg:secondary)'
vimcmd_replace_symbol = '[](bold fg:secondary)'
vimcmd_visual_symbol = '[](bold fg:accent)'

[cmd_duration]
min_time = 3000
format = '[ 󱎫 $duration]($style) '
style = "fg:warning"

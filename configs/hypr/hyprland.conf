# Hyprland Configuration
# This file contains the main Hyprland settings
# Can be used standalone or sourced alongside the Nix-managed startup

# ==============================================================================
# Environment Variables
# ==============================================================================
# Required for Nvidia compatibility
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# ==============================================================================
# Cursor
# ==============================================================================
cursor {
    no_hardware_cursors = true  # Compatibility with Nvidia
    inactive_timeout = 20       # Hide cursor after 20 seconds of inactivity
}

# ==============================================================================
# Monitors
# ==============================================================================
# Default for any monitor
monitor = ,preferred,auto,auto

# External monitors (Dell)
monitor = desc:Dell Inc. DELL U3419W 1Y9Q5T2, preferred, auto-left, 1
monitor = desc:Dell Inc. DELL U2515H X48H66CQ0D1L, preferred, auto-right, 1

# ==============================================================================
# General Settings
# ==============================================================================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1
    allow_tearing = false        # See https://wiki.hyprland.org/Configuring/Tearing/
    resize_on_border = true      # Enable resizing by clicking and dragging on borders
    layout = dwindle
}

# ==============================================================================
# Window Rules
# ==============================================================================
# See: https://wiki.hyprland.org/Configuring/Window-Rules/
windowrule {
  name = windowrule-1
  workspace = 1
  match:title = (.*)(- Youtube)$
}

windowrule {
  name = windowrule-2
  workspace = 3
  match:class = ^(obsidian)$
}

windowrule {
  name = windowrule-3
  workspace = 6
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-4
  workspace = 7
  match:class = ^(Zotero)$
}


# ==============================================================================
# Decoration
# ==============================================================================
decoration {
    rounding = 16

    blur {
        enabled = true
        brightness = 1.0
        contrast = 1.0
        noise = 0.01
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        passes = 4
        size = 7
        popups = true
        popups_ignorealpha = 0.2
    }
}

# ==============================================================================
# Animations
# ==============================================================================
# See https://wiki.hyprland.org/Configuring/Animations/
animations {
    enabled = true

    animation = border, 1, 2, default
    animation = fade, 1, 4, default
    animation = windows, 1, 3, default, popin 80%
    animation = workspaces, 1, 2, default, slide
}

# ==============================================================================
# Input
# ==============================================================================
input {
    kb_layout = us
    follow_mouse = 1            # Focus change on cursor move
    accel_profile = flat

    touchpad {
        scroll_factor = 0.1
        natural_scroll = true
    }
}

# ==============================================================================
# Layout
# ==============================================================================
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true           # Master switch for pseudotiling (bound to SUPER + P)
    preserve_split = true       # Keep floating dimensions while tiling
}

# ==============================================================================
# Render & Misc
# ==============================================================================
render {
    direct_scanout = true
}

misc {
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}

debug {
    disable_logs = false
}

# ==============================================================================
# Workspace Assignments
# ==============================================================================
# Workspaces 1-5 on ultrawide, 6-10 on secondary
workspace = 1, monitor:desc:Dell Inc. DELL U3419W 1Y9Q5T2
workspace = 2, monitor:desc:Dell Inc. DELL U3419W 1Y9Q5T2
workspace = 3, monitor:desc:Dell Inc. DELL U3419W 1Y9Q5T2
workspace = 4, monitor:desc:Dell Inc. DELL U3419W 1Y9Q5T2
workspace = 5, monitor:desc:Dell Inc. DELL U3419W 1Y9Q5T2
workspace = 6, monitor:desc:Dell Inc. DELL U2515H X48H66CQ0D1L
workspace = 7, monitor:desc:Dell Inc. DELL U2515H X48H66CQ0D1L
workspace = 8, monitor:desc:Dell Inc. DELL U2515H X48H66CQ0D1L
workspace = 9, monitor:desc:Dell Inc. DELL U2515H X48H66CQ0D1L
workspace = 10, monitor:desc:Dell Inc. DELL U2515H X48H66CQ0D1L

# ==============================================================================
# Mouse Bindings
# ==============================================================================
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER ALT, mouse:272, resizewindow

# ==============================================================================
# Key Bindings - Window Management
# ==============================================================================
bind = SUPER, C, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, G, togglegroup,
bind = SUPER SHIFT, N, changegroupactive, f
bind = SUPER SHIFT, P, changegroupactive, b
bind = SUPER, A, togglesplit,
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo,

# ==============================================================================
# Key Bindings - Applications
# ==============================================================================
bind = SUPER, S, exec, pgrep hyprlock || hyprlock
bind = SUPER, B, exec, vivaldi
bind = SUPER, T, exec, ghostty
bind = SUPER, E, exec, thunar
bind = SUPER, U, exec, XDG_CURRENT_DESKTOP=gnome gnome-control-center
bind = SUPER, R, exec, rofi -show drun -show-icons
bind = SUPER, W, exec, rofi -show window -show-icons

# ==============================================================================
# Key Bindings - Navigation
# ==============================================================================
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER, bracketleft, workspace, m-1
bind = SUPER, bracketright, workspace, m+1
bind = SUPER SHIFT, bracketleft, focusmonitor, l
bind = SUPER SHIFT, bracketright, focusmonitor, r
bind = SUPER SHIFT ALT, bracketleft, movecurrentworkspacetomonitor, l
bind = SUPER SHIFT ALT, bracketright, movecurrentworkspacetomonitor, r

# Screenshot
bind = , Print, exec, grimblast copy area

# ==============================================================================
# Key Bindings - Workspaces
# ==============================================================================
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# ==============================================================================
# Lid Switch & Hardware Events
# ==============================================================================
# Disable laptop monitor on lid close, enable on lid open
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1,3840x2400, 0x0, 1"

# ==============================================================================
# Media Keys
# ==============================================================================
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Volume (with repeat)
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l '1.0' @DEFAULT_AUDIO_SINK@ 6%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l '1.0' @DEFAULT_AUDIO_SINK@ 6%-

# Brightness (with repeat)
bindle = , XF86MonBrightnessUp, exec, brillo -q -u 300000 -A 5
bindle = , XF86MonBrightnessDown, exec, brillo -q -u 300000 -U 5

name: NixOS CI

# Build gate and promotion (ADR 0001).
#
# Every host configuration is built on every pull request and on every push to
# master. On master, once the gate passes, `deploy` is fast-forwarded to the
# tested commit. Hosts run `system.autoUpgrade` against `deploy`, so a revision
# that fails to build for any host can never reach a machine.
#
# Builds are pushed to the `corygyarmathy-dotfiles` Cachix cache, which the
# hosts substitute from - CI builds the closure once instead of each host
# rebuilding it independently at 04:00.
#
# NOTE: the PR build and the master build look like the same build run twice.
# They are not, and dropping the master one breaks promotion. `self.rev` is
# baked into `system.configurationRevision` (flake.nix), so the toplevel store
# path is a function of the commit SHA - and a squash merge always mints a new
# SHA. Master's toplevel therefore cannot have been built on the PR even when
# the tree is byte-identical. In practice the master run substitutes the whole
# closure and builds ~19 rev-dependent derivations on top. Without it,
# `promote` would move `deploy` to a closure the gate never built and the cache
# never held, and every host would build that tail itself at 04:00.
#
# What the master run is *not* covering is a merge of stale content: the
# `protect-main` ruleset sets `strict_required_status_checks_policy`, so a PR
# must be up to date with master before it can merge, which makes the merge ref
# the PR built the tree that actually lands.
#
# NOTE: the `nixos ci` job name is the status-check context required by the
# `protect-main` repository ruleset. Renaming that job silently blocks every
# merge until the ruleset is updated to match, so treat the two as a pair.
#
# NOTE: never create a branch under `deploy/`. Git stores
# refs as paths, so a `deploy/my-branch` ref makes `refs/heads/deploy` a
# directory, and promotion then fails with "directory file conflict" for as long
# as that branch exists. The `reserve-deploy-namespace` ruleset blocks this at
# the server, but the failure is obscure enough to be worth naming here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Allows manual triggering

# Read-only by default; the promote job opts into contents: write for itself.
permissions:
  contents: read

# A newer commit on the same branch makes an in-flight run obsolete. Never
# cancel on master, since those runs are what promote `deploy`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, flake-level evaluation, and the audit that keeps the `checks`
  # matrix below honest. Nothing here builds a closure, so the job finishes
  # well inside the host builds and never sits on the critical path.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      # Formatting runs before the audit's checkout-modifying steps. `nix fmt`
      # resolves to nixfmt-tree (flake.nix), which formats in place and then
      # fails because it changed something - that is what makes it a gate, and
      # also why it leaves the runner's checkout modified. Nothing below reads
      # the formatting of the tree, only its content.
      - name: Check formatting
        run: nix fmt -- --ci

      # The `checks` matrix builds each check by attribute path, which no
      # longer evaluates the flake as a whole. That was never the point of
      # `nix flake check`, but it was a side effect worth keeping: it is what
      # notices an output that stopped evaluating.
      #
      # Only three outputs actually lost coverage, so only those are evaluated
      # here. `checks` is covered by the matrix and `nixosConfigurations` by
      # the build matrix, both more thoroughly than evaluation. `overlays` is
      # applied by every host build and `formatter` is exercised by the step
      # above, so both are already covered too.
      #
      # NOT `nix flake check --no-build`, which is what this started as and
      # which cannot work here: stylix reads a base16 scheme through
      # import-from-derivation, so evaluating any host needs that derivation
      # *built*, and --no-build forbids exactly that. It fails with
      # "path '...-base16-schemes-....drv' is not valid". It passes on a
      # developer's machine, because the path is already in their store from
      # the last host build - a false pass that only shows up on a clean
      # runner.
      #
      # `apps` is the expensive one: garden-preview reads homelab01's
      # evaluated config, so this evaluates a whole host. It is kept because
      # nothing else covers preview.nix, and the job still finishes far inside
      # the host builds it runs beside.
      - name: Evaluate the outputs nothing else covers
        run: |
          set -euo pipefail
          echo "devShells:"
          nix eval --raw .#devShells.x86_64-linux.default.drvPath
          echo
          echo "packages:"
          nix eval --json .#packages.x86_64-linux \
            --apply 'ps: builtins.map (p: p.drvPath) (builtins.attrValues ps)'
          echo "apps:"
          nix eval --raw .#apps.x86_64-linux.garden-preview.program
          echo

      # The matrix below names each check explicitly rather than discovering
      # them, because discovery costs a serialised job ahead of every shard and
      # the gate has a wall-clock budget. The price of naming them is that a
      # check added to ./checks and not added to the matrix silently stops
      # being run - the same "gate that quietly stops gating" failure the
      # `always()` note on the gate job is about. So assert the two agree.
      #
      # yq is a lint-time tool rather than a build input, so taking it from the
      # unpinned registry is fine here; it is not going into anything shipped.
      - name: Every flake check is in the matrix
        run: |
          set -euo pipefail
          # LC_ALL=C on both sides: the names contain hyphens, which some
          # locales collate as though they were not there, and a comparison
          # that depends on the runner's locale is a comparison that will
          # eventually disagree with itself for no reason.
          nix eval --raw .#checks.x86_64-linux \
            --apply 'cs: builtins.concatStringsSep "\n" (builtins.attrNames cs)' \
            | LC_ALL=C sort > /tmp/flake-checks
          nix shell nixpkgs#yq-go --command \
            yq -r '.jobs.checks.strategy.matrix.check[]' .github/workflows/ci.yml \
            | LC_ALL=C sort > /tmp/matrix-checks
          if ! diff -u /tmp/flake-checks /tmp/matrix-checks; then
            echo "::error::checks in the flake and checks in the ci.yml matrix disagree (- flake, + matrix)"
            exit 1
          fi
          echo "::notice::$(wc -l < /tmp/flake-checks) checks, all present in the matrix"

  # One runner per check, rather than one runner running `nix flake check`.
  #
  # The checks are independent, so a single job is as slow as their sum while
  # four of the runner's cores idle waiting on VM boots. Sharded, the job is as
  # slow as the *slowest* check. This is what took the gate back inside the
  # host build after the alerting subtests pushed `flake check` past it for the
  # second time - see "The gate outgrew the build" in
  # docs/plans/deployment-hardening.md.
  #
  # It costs runner-minutes: ten jobs each pay ~30s of checkout and installer
  # that one job paid once. On a public repository those minutes are free, and
  # wall clock is the thing with a budget.
  checks:
    name: check ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      # Same reasoning as the host matrix: knowing that three checks fail is
      # more useful than knowing that one does.
      fail-fast: false
      matrix:
        check:
          - alert-rules
          - alert-rules-unit
          - alertmanager-config
          - bless-boot-guard
          - digital-garden
          - digital-garden-sync-health
          - grafana
          - monitoring
          - reverse-proxy
          - upgrade-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # The hosts trust this cache for Hyprland; CI needs it too, or every
          # Hyprland-adjacent path is built from source here.
          extra-conf: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: corygyarmathy-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Substitute only. This job does build things - the behaviour test
          # VMs in ./checks - but nothing a host will ever need, and the test
          # runners themselves have to execute on every commit regardless of
          # whether their closure was cached.
          skipPush: true

      # The behaviour tests boot real VMs. With KVM that is around a minute
      # each; without it QEMU falls back to TCG emulation and the same tests
      # take long enough to matter for a gate that also has to promote. This
      # step does not fail the build either way - it just makes the answer
      # visible in the log, so a gate that suddenly got slow has an
      # explanation rather than a mystery. See the "Cost and risks" section of
      # docs/plans/deployment-hardening.md.
      - name: Report KVM availability
        run: |
          if [ -e /dev/kvm ]; then
            echo "::notice::/dev/kvm present - NixOS tests run accelerated"
          else
            echo "::warning::/dev/kvm absent - NixOS tests fall back to TCG emulation"
          fi

      - name: Run ${{ matrix.check }}
        run: |
          nix build --print-build-logs --no-link \
            ".#checks.x86_64-linux.${{ matrix.check }}"

  build:
    name: build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      # Build every host even when one fails - knowing that two of three hosts
      # are broken is more useful than knowing one is.
      fail-fast: false
      matrix:
        host: [homelab01, homelab02, xps15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: corygyarmathy-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The action's own push runs as a post-job step, where a failure fails
          # the job - which would let a cache hiccup block a deployment. The
          # cache is a performance dependency, not a correctness one (ADR 0001),
          # so we push explicitly below instead.
          skipPush: true

      - name: Build ${{ matrix.host }}
        run: |
          nix build --print-build-logs --no-link --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            | tee "$RUNNER_TEMP/toplevel"

      # Deliberately non-fatal: if this fails, the hosts build from source at
      # 04:00 instead of substituting. Slower, never wrong. Pushing the toplevel
      # pushes its closure, which is exactly what a host needs - and nothing
      # build-time-only, unlike the action's watch-the-whole-store approach.
      - name: Push ${{ matrix.host }} closure to Cachix
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push corygyarmathy-dotfiles < "$RUNNER_TEMP/toplevel"

  # Single stable status-check context for the ruleset. Matrix job names change
  # whenever a host is added or renamed; this one does not.
  gate:
    name: nixos ci
    runs-on: ubuntu-latest
    needs: [lint, checks, build]
    # `always()` so the gate reports a real failure when a dependency fails.
    # Without it the job is *skipped*, and a skipped required check does not
    # block a merge - the gate would silently stop gating.
    if: always()
    steps:
      # A matrix dependency reports one aggregate result, so `checks` and
      # `build` here each stand for every shard: any shard failing makes the
      # whole `needs` entry fail.
      - name: Verify all checks passed
        run: |
          echo "lint:   ${{ needs.lint.result }}"
          echo "checks: ${{ needs.checks.result }}"
          echo "build:  ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
          [ "${{ needs.checks.result }}" = "success" ] || exit 1
          [ "${{ needs.build.result }}" = "success" ] || exit 1

  # Fast-forward `deploy` to the commit that just passed the gate. This is the
  # only thing that moves what the fleet runs (ADR 0001).
  promote:
    name: promote to deploy
    runs-on: ubuntu-latest
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow clone cannot be used to update another ref.
          fetch-depth: 0

      - name: Fast-forward deploy
        run: |
          set -euo pipefail
          # Deliberately not a force push: if `deploy` has diverged from master,
          # something manual happened and it should fail loudly rather than
          # silently discard whatever is there.
          git push origin "${{ github.sha }}:refs/heads/deploy"
          echo "::notice::deploy now at ${{ github.sha }}"

name: Update obsidian-headless

# obsidian-headless is pinned to an explicit npm version, so `nix flake update`
# never moves it. This checks the registry weekly and opens a PR when there is a
# newer release; the PR still has to pass the normal CI build before merging.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin (blank = latest)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Bump to latest release
        id: bump
        run: |
          out=$(./packages/obsidian-headless/update.sh ${{ inputs.version }})
          echo "$out"
          # The script prints nothing on stdout when already current.
          if [ -n "$out" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$out" >> "$GITHUB_OUTPUT"
            echo "version=${out##* }" >> "$GITHUB_OUTPUT"
          fi

      # Build here rather than relying on the PR's CI run, so a release that
      # cannot build never becomes a PR in the first place.
      - name: Build the new version
        if: steps.bump.outputs.changed == 'true'
        run: nix build .#obsidian-headless -L

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/obsidian-headless-${{ steps.bump.outputs.version }}
          title: "chore(obsidian-headless): ${{ steps.bump.outputs.summary }}"
          commit-message: |
            chore(obsidian-headless): ${{ steps.bump.outputs.summary }}

            Regenerated by packages/obsidian-headless/update.sh: version,
            tarball hash, vendored package-lock.json and npmDepsHash.
          body: |
            Automated bump by `packages/obsidian-headless/update.sh`.

            `${{ steps.bump.outputs.summary }}`

            Regenerated together: `version`, `src.hash`, the vendored
            `package-lock.json` and `npmDepsHash`. `nix build .#obsidian-headless`
            passed before this PR was opened.

            Worth a glance before merging: whether `ob sync --continuous --path`
            is still the right invocation for
            `modules/home/desktop/obsidian-sync.nix`, since upstream is
            pre-1.0 and the CLI surface is not stable.
          delete-branch: true

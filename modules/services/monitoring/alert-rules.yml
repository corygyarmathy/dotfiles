groups:
  - name: node
    rules:
      # Disk space alerts
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: 'Filesystem {{ $labels.mountpoint }} has {{ printf "%.1f" $value }}% free space'

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: 'Filesystem {{ $labels.mountpoint }} has {{ printf "%.1f" $value }}% free space'

      # SMART disk health
      - alert: DiskSmartUnhealthy
        expr: smartctl_device_smart_healthy != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART health check failed"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} is reporting unhealthy"

      # Systemd unit failures (catches NFS mount failures too)
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Systemd unit failed on {{ $labels.instance }}"
          description: "Unit {{ $labels.name }} has been in failed state for 5+ minutes"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: 'Memory usage is {{ printf "%.1f" $value }}%'

      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: 'CPU usage is {{ printf "%.1f" $value }}%'

      - alert: HighDriveTemperature
        expr: smartctl_device_temperature > 55
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Drive {{ $labels.device }} running hot on {{ $labels.instance }}"
          description: 'Temperature is {{ printf "%.0f" $value }}°C (threshold: 55°C)'

      - alert: HighSystemTemperature
        expr: node_hwmon_temp_celsius > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High system temperature on {{ $labels.instance }}"
          description: 'Sensor {{ $labels.sensor }} reading {{ printf "%.0f" $value }}°C'

      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: "Prometheus cannot reach {{ $labels.instance }} for job {{ $labels.job }}"

  - name: services
    rules:
      # HTTP probe failures
      - alert: ServiceDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service unreachable"
          description: "{{ $labels.instance }} has been down for 5+ minutes"

  - name: infrastructure
    rules:
      # Auto-upgrade failures
      - alert: NixosUpgradeFailed
        expr: node_systemd_unit_state{name="nixos-upgrade.service", state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NixOS upgrade failed on {{ $labels.instance }}"
          description: "The nixos-upgrade service has failed - check logs with: journalctl -u nixos-upgrade"

      # Unexpected reboot detection
      - alert: UnexpectedReboot
        expr: |
          (time() - node_boot_time_seconds) < 600 
          and changes(node_boot_time_seconds[1h]) > 0
          and (hour() < 20 or hour() >= 21)
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} rebooted unexpectedly"
          description: 'System booted {{ printf "%.0f" $value }} seconds ago (outside maintenance window)'

  - name: zfs
    rules:
      # ZFS pool health - fires if pool is not ONLINE
      - alert: ZfsPoolUnhealthy
        expr: zfs_pool_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is unhealthy on {{ $labels.instance }}"
          description: "Pool {{ $labels.pool }} is in {{ $labels.state }} state - investigate immediately"

      # ZFS pool degraded (specific state)
      - alert: ZfsPoolDegraded
        expr: zfs_pool_state{state="DEGRADED"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is DEGRADED on {{ $labels.instance }}"
          description: "Pool {{ $labels.pool }} is degraded - one or more devices have failed. Check 'zpool status {{ $labels.pool }}' for details."

      # ZFS pool faulted (data loss possible)
      - alert: ZfsPoolFaulted
        expr: zfs_pool_state{state="FAULTED"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is FAULTED on {{ $labels.instance }}"
          description: "Pool {{ $labels.pool }} is faulted - DATA LOSS MAY HAVE OCCURRED. Immediate action required!"

      # ZFS checksum errors (data corruption indicator)
      - alert: ZfsChecksumErrors
        expr: zfs_pool_checksum_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS checksum errors on pool {{ $labels.pool }}"
          description: 'Pool {{ $labels.pool }} on {{ $labels.instance }} has {{ $value }} checksum errors - run "zpool scrub {{ $labels.pool }}" and check disk health'

      # ZFS read/write errors
      - alert: ZfsIOErrors
        expr: zfs_pool_read_errors > 0 or zfs_pool_write_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS I/O errors on pool {{ $labels.pool }}"
          description: "Pool {{ $labels.pool }} on {{ $labels.instance }} has I/O errors (read: {{ $value }}) - check disk health"

      # ZFS scrub errors (corruption found during scrub)
      - alert: ZfsScrubErrors
        expr: zfs_pool_scrub_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS scrub found errors on pool {{ $labels.pool }}"
          description: 'Last scrub of {{ $labels.pool }} on {{ $labels.instance }} found {{ $value }} errors - check "zpool status {{ $labels.pool }}" for details'

      # ZFS scrub overdue (more than 14 days since last scrub)
      - alert: ZfsScrubOverdue
        expr: zfs_pool_scrub_age_seconds > (14 * 24 * 60 * 60)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "ZFS scrub overdue on pool {{ $labels.pool }}"
          description: 'Pool {{ $labels.pool }} on {{ $labels.instance }} has not been scrubbed in {{ $value | humanizeDuration }} - run "zpool scrub {{ $labels.pool }}"'
  - name: cloudflare_tunnel
    rules:
      # Tunnel service down
      - alert: CloudflareTunnelDown
        expr: up{job="cloudflared"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflare Tunnel is down on {{ $labels.instance }}"
          description: "The cloudflared service is not responding - public services are unreachable"

      # No active connections
      - alert: CloudflareTunnelNoConnections
        expr: cloudflared_tunnel_ha_connections < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflare Tunnel has no active connections"
          description: "Tunnel has {{ $value }} connections (expected 4) - public services may be unreachable"

      # Low connection count (degraded but not down)
      - alert: CloudflareTunnelDegraded
        expr: cloudflared_tunnel_ha_connections < 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Tunnel connection count low"
          description: "Tunnel has only {{ $value }} connections out of 4 - performance may be degraded"

      # High error rate through tunnel
      - alert: CloudflareTunnelHighErrorRate
        expr: |
          rate(cloudflared_tunnel_request_errors[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate through Cloudflare Tunnel"
          description: "Tunnel is seeing {{ $value | humanizePercentage }} errors - check service health and logs"

      # Systemd service failure
      - alert: CloudflareTunnelServiceFailed
        expr: node_systemd_unit_state{name="cloudflared-tunnel.service", state="failed"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "cloudflared-tunnel.service has failed"
          description: "The systemd service is in failed state - check logs with: journalctl -u cloudflared-tunnel"

      # Service restarting frequently (crash loop)
      - alert: CloudflareTunnelCrashLoop
        expr: rate(cloudflared_tunnel_server_restarts[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Tunnel is restarting frequently"
          description: "The tunnel has restarted {{ $value }} times in the last 15 minutes - check for stability issues"
  - name: backups
    rules:
      - alert: ResticBackupFailed
        expr: restic_backup_last_run_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Restic backup {{ $labels.job }} failed on {{ $labels.host }}"
      - alert: ResticBackupStale
        expr: time() - restic_backup_last_run_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Restic backup {{ $labels.job }} on {{ $labels.host }} hasn't run in over 26 hours"
  - name: deploy
    rules:
      # A non-zero exit does not tell you which generation is running.
      # `nixos-rebuild switch` exits non-zero if any unit is failing once
      # activation has finished, so the common case is that the new generation
      # activated fine and something on it is unhappy - not that the upgrade
      # was declined. Saying otherwise sends you looking in the wrong place at
      # 4am. Once upgrade-verify's rollback is armed the previous generation
      # will be the usual outcome again, and this wording should follow it.
      - alert: NixosDeployFailed
        expr: nixos_deploy_last_run_success == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NixOS auto-upgrade failed on {{ $labels.host }}"
          description: "The last nixos-upgrade run exited non-zero. Check `readlink /run/current-system` against `journalctl -u nixos-upgrade` before assuming anything: activation may have completed and then tripped the post-activation check for failed units. Either way the host has stopped tracking the promoted ref."

      # The one that catches silence. A host that stops upgrading raises nothing
      # at all otherwise: no failed unit, no failed probe, just a machine
      # quietly falling behind. Only arms once a first run has been recorded.
      - alert: NixosDeployStale
        expr: time() - nixos_deploy_last_run_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "NixOS auto-upgrade has not run on {{ $labels.host }} in over 48 hours"
          description: "Neither a success nor a failure has been recorded. The timer, the network, the flake ref or the host itself has stopped."

      # nixos-upgrade stages a generation with `nixos-rebuild boot`, then reboots
      # only if the kernel changed AND the clock is still inside the reboot
      # window. A long build pushes it past the window, and the unit reports
      # success while the new kernel never activates.
      #
      # Deliberately not expressed as `for: 26h`: Prometheus restarts on every
      # deploy, which resets a pending alert's timer, so a long `for` would
      # never mature. The staged timestamp carries the duration instead.
      - alert: NixosRebootPending
        expr: nixos_deploy_pending_reboot == 1 and time() - nixos_deploy_staged_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has a generation staged but not activated for over 26 hours"
          description: "A new kernel is staged and waiting for a reboot that has not happened — most likely the build ran past the configured reboot window, which nixos-upgrade reports as success."

      # Health-gated activation (modules/nixos/upgrade-verify.nix). The upgrade
      # itself succeeded — this is about what the generation did once it was
      # running, which NixosDeployFailed cannot see.
      #
      # Only counts units that were not already failing before the upgrade
      # started, so this is a claim about the new generation specifically.
      #
      # Fires for hand-applied generations too, which is the point - nothing
      # else checks those. Rollback deliberately will not act on them, so
      # check nixos_verify_manual_generation before wondering why the host is
      # still sitting on a generation that failed verification.
      - alert: NixosVerifyFailed
        expr: nixos_verify_result == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} activated a generation that did not come up healthy"
          description: "Verification found units failing that were not failing before the upgrade. If nixos_verify_manual_generation is 1 this generation was applied by hand and will not be rolled back automatically — it is yours to fix or revert. Check: journalctl -u nixos-upgrade-verify.service"

      # The silence problem, applied to the safety net itself. NixosVerifyFailed
      # only speaks when verification runs and fails; if it stopped running —
      # timer broken, module disabled, unit masked — nixos_verify_result would
      # sit at 1 forever and the absence of alerts would read as evidence of
      # health. That absence is exactly what the decision to arm
      # cg.upgrade-verify.rollback.enable rests on, so it needs checking.
      #
      # Not a plain staleness check on the timestamp: verification deliberately
      # no-ops when the generation has not changed, and exits before writing
      # metrics, so on a night where `deploy` did not move the timestamp goes
      # stale for entirely correct reasons. What is wrong is a generation
      # staged well after the last verification — activated, but never checked.
      #
      # `pending_reboot == 0` excludes the staged-but-not-yet-activated case,
      # which is NixosRebootPending's business and would otherwise fire here
      # first and more noisily for the same underlying condition.
      #
      # 6h rather than something tighter because a manual `nixos-rebuild
      # switch` also trips this — correctly, since it activates a generation
      # nothing verifies — and iterating on a service should not page you.
      - alert: NixosVerifyStale
        expr: |
          (nixos_deploy_staged_timestamp_seconds - nixos_verify_timestamp_seconds > 21600)
          and nixos_deploy_pending_reboot == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} is running a generation that activation verification never checked"
          description: "A generation was activated over 6 hours ago and nixos-upgrade-verify has not recorded a result since. Either it is not running, or the generation was applied by hand. Check: systemctl status nixos-upgrade-verify.timer"

      # Loud on purpose. A host that reverts itself stops tracking the promoted
      # ref, and would otherwise announce that two days later as NixosDeployStale
      # — an alert whose text points nowhere near the actual cause.
      - alert: NixosRolledBack
        expr: nixos_verify_rolled_back == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} rolled itself back to its previous generation"
          description: "Activation verification failed and the host reverted. It is running an older revision than the one deploy points at, and will be offered the same revision again tonight. Fix forward."

  - name: vpn
    rules:
      - alert: GluetunVpnDisconnected
        expr: gluetun_vpn_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gluetun VPN is disconnected on {{ $labels.instance }}"
          description: "WireGuard tunnel is down — qBittorrent has no internet access"

      - alert: GluetunPortNotForwarded
        expr: gluetun_vpn_connected == 1 and gluetun_port_forwarded == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gluetun has no forwarded port on {{ $labels.instance }}"
          description: "VPN is connected but port forwarding returned 0 — qBittorrent will show as firewalled"

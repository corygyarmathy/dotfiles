# SOPS Configuration
# This file defines which age keys can decrypt which secret files.
#
# To get your user's age public key:
#   cat ~/.config/sops/age/keys.txt | grep "public key:"
#
# To get a host's age public key (from SSH host key):
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#
# After adding/removing keys, run:
#   sops updatekeys secrets/secrets.yaml

keys:
  # User keys - for encrypting on your workstation
  - &coryg age1emdtpejkq68k5zpp09fy6ak4wrkjmhuz4yxx9pmkk7r4h56tgppsqf9tuh

  # Host keys - derived from SSH host keys, for decrypting at boot
  - &xps15 age1lp2gnrprq0nhz55mq58p54e28f5zxr6ps7swzz5qpud2ldynjqxqvfc2px

  # Add future hosts here:
  # - &server age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

creation_rules:
  # Main secrets file - accessible by user and xps15 host
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *coryg
          - *xps15

  # Host-specific secrets (if you create per-host secret files)
  - path_regex: hosts/.*/secrets\.yaml$
    key_groups:
      - age:
          - *coryg
          # Add specific host key here when creating host-specific secrets

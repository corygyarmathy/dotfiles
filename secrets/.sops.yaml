# Which age keys can decrypt which secret files.
#
# LAYOUT. One file per host, plus one for what genuinely crosses hosts and one
# for what belongs to a person rather than a machine:
#
#   shared.yaml     read by both servers; every entry has to earn its place
#   homelab01.yaml  only homelab01 declares these
#   homelab02.yaml  only homelab02 declares these
#   xps15.yaml      only the laptop declares these
#   operator.yaml   no host key opens these: the user's own key material, CI
#                   tokens, and the web logins for services that keep their
#                   own user database
#
# The rule is that a secret lives in the file for the host that needs it, where
# "needs" means a `sops.secrets.<name>` declaration in that host's evaluated
# configuration. checks/secrets.nix enforces it: a name a host declares but its
# files do not carry fails `nix flake check` rather than activation at 04:00.
#
# EACH RULE BELOW IS THE WHOLE OF WHAT A KEY CAN OPEN. A host is a recipient
# of its own file and of nothing else it does not read: homelab01 cannot
# decrypt homelab02.yaml, and xps15 - the machine that leaves the house -
# cannot decrypt any server secret. operator.yaml is opened by the user key
# alone. checks/secrets.nix fails if a key reappears in a rule.
#
# To get your user's age public key:
#   cat ~/.config/sops/age/keys.txt | grep "public key:"
#
# To get a host's age public key (from SSH host key):
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#
# After adding or removing keys here, run `sops updatekeys <file>` for each
# file whose rule changed. Editing a file with `sops` does NOT re-key it.

keys:
  # User key - the one on the workstation, and the only key that can read
  # every file. Present in every rule below: lose it and nothing here can be
  # edited again from a machine that is not one of the hosts.
  - &coryg age1emdtpejkq68k5zpp09fy6ak4wrkjmhuz4yxx9pmkk7r4h56tgppsqf9tuh

  # Host keys - derived from SSH host keys, for decrypting at activation.
  # Reinstalling a host changes its SSH host key and therefore this value;
  # see ./README.md, "After a reinstall".
  - &xps15 age1lp2gnrprq0nhz55mq58p54e28f5zxr6ps7swzz5qpud2ldynjqxqvfc2px

  - &homelab01 age1xg2cx4mzsfh62nqfga04q0l0ahqdcqe42t46zt69cejlg7ws3azsf0gzh2
  - &homelab02 age15h2tcfx9dw5qeyx4cgg358wlzr489vvq272s6wm7gud6mrkmregsp9s6x6

creation_rules:
  # Both servers back up to the same repositories, alert through the same
  # ntfy and SMTP accounts, run the same AdGuard pair and terminate TLS with
  # the same Cloudflare DNS token. Those are the entries in this file.
  - path_regex: secrets/shared\.yaml$
    key_groups:
      - age:
          - *coryg
          - *homelab01
          - *homelab02

  - path_regex: secrets/homelab01\.yaml$
    key_groups:
      - age:
          - *coryg
          - *homelab01

  - path_regex: secrets/homelab02\.yaml$
    key_groups:
      - age:
          - *coryg
          - *homelab02

  - path_regex: secrets/xps15\.yaml$
    key_groups:
      - age:
          - *coryg
          - *xps15

  # Nothing in here is read by a machine: the user key decrypts it on the
  # workstation, by hand or through home-manager. No host key belongs here, so
  # losing the user key loses this file - it is the one to have a copy of.
  - path_regex: secrets/operator\.yaml$
    key_groups:
      - age:
          - *coryg
